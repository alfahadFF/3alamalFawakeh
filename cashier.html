            --primary-hover: #b80710;

            --text-color: #ffffff;
            --text-muted: #a0a0a0;

        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }

        .cashier-header {
            text-align: center; padding: 15px 0 20px;
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 15px;
        }
        .cashier-title { font-size: 1.8rem; font-weight: 900; color: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .cashier-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .toolbar {
            max-width: 900px; margin: 0 auto 15px;
            display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .toolbar-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .btn {
            padding: 9px 15px; border-radius: 8px; border: none; font-weight: 700;
            font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s ease;
        }
        .btn:active { opacity: 0.8; }
        .btn-refresh { background-color: var(--primary-color); color: white; }
        .btn-auth { background-color: #262626; color: #ffca28; border: 1px solid #444; }
        .btn-sound { background-color: #1e3a1e; color: #4caf50; border: 1px solid #2e7d32; }
        .btn-sound.muted { background-color: #332020; color: #ff5252; border: 1px solid #5c2525; }
        
        .qz-status-badge {
            padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px; background: #262626; border: 1px solid #444; color: #aaa;
        }
        .qz-status-badge.connected { color: #25d366; border-color: #2e7d32; background: #132a13; }

        /* تبويبات التصفية */
        .filter-tabs {
            max-width: 900px; margin: 0 auto 15px;
            display: flex; gap: 8px; background: #1a1a1a; padding: 6px; border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            background: transparent; color: var(--text-muted); font-weight: 800;
            font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab-btn.active {
            background: var(--primary-color); color: white;
            box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
        }
        .tab-badge {
            background: rgba(0,0,0,0.3); padding: 2px 7px; border-radius: 10px; font-size: 0.75rem;
        }

        .orders-grid {
            max-width: 900px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 16px;
        }

        .order-card {
            background-color: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color);
            padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; gap: 12px;
            animation: fadeIn 0.4s ease;
        }
        .order-card.archived {
            opacity: 0.7; background-color: #141414; border-color: #2a2a2a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-head {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed var(--border-color); padding-bottom: 10px;
        }
        .order-id { font-size: 1.4rem; font-weight: 900; color: var(--primary-color); display: inline-flex; align-items: baseline; gap: 4px; }
        .order-id-prefix { font-size: 0.8rem; font-weight: 800; color: #888; text-transform: uppercase; }
        
        .badges-wrap { display: flex; gap: 6px; align-items: center; }
        .order-badge {

        .status-badge {

        async function preloadImageToBase64(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) return '';
                const blob = await response.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve('');
                    reader.readAsDataURL(blob);
                });
            } catch (err) {
                return '';
            }
        }

        async function connectQZ() {
            const statusEl = document.getElementById('qz-status');

                setupQzSecurity();
                if (!qz.websocket.isActive()) {
                    await qz.websocket.connect({ retries: 5, delay: 2 });
                }
                isQzConnected = true;
                statusEl.className = 'qz-status-badge connected';
                statusEl.innerHTML = '<i class="fa-solid fa-bolt"></i> الطباعة الآلية: متصلة (الطابعتين)';

                isQzConnected = false;
                statusEl.className = 'qz-status-badge';
                statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#ffca28;"></i> QZ Tray غير متصل';
            }
        }

        function parseOrderDate(order) {
            if (!order || !order.date) return new Date();
            try {
                let dateStr = String(order.date).trim();
                const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
                arabicDigits.forEach((digit, i) => { dateStr = dateStr.replace(new RegExp(digit, 'g'), i); });

                const isPM = dateStr.includes('م') || /pm/i.test(dateStr);
                const isAM = dateStr.includes('ص') || /am/i.test(dateStr);
                dateStr = dateStr.replace(/[صمAPMapm]/g, '').trim();

                const parts = dateStr.split(/[\s,]+/);
                if (parts.length < 2) {
                    const singleDate = new Date(dateStr);
                    return isNaN(singleDate.getTime()) ? new Date() : singleDate;
                }

                const dateParts = parts[0].split(/[\/\-\.]/).map(p => parseInt(p, 10));
                const timeParts = parts[1].split(':').map(p => parseInt(p, 10));
                if (dateParts.length < 3 || timeParts.length < 1) return new Date();

                let day, month, year;
                if (dateParts[0] > 1000) { year = dateParts[0]; month = dateParts[1] - 1; day = dateParts[2]; }
                else { day = dateParts[0]; month = dateParts[1] - 1; year = dateParts[2]; }

                let hours = timeParts[0];
                const minutes = timeParts[1] || 0;
                const seconds = timeParts[2] || 0;
                if (isPM && hours < 12) hours += 12;
                if (isAM && hours === 12) hours = 0;

                const orderDateObj = new Date(year, month, day, hours, minutes, seconds);
                return isNaN(orderDateObj.getTime()) ? new Date() : orderDateObj;
            } catch (err) {
                return new Date();
            }
        }

        function computeDailySequences(orders) {
            if (!Array.isArray(orders)) return;
            const groups = {};

            orders.forEach(ord => {
                const dateObj = parseOrderDate(ord);
                const shiftTime = dateObj.getTime() - (8 * 60 * 60 * 1000);
                const shiftDate = new Date(shiftTime);
                const cycleKey = `${shiftDate.getFullYear()}-${shiftDate.getMonth() + 1}-${shiftDate.getDate()}`;

                if (!groups[cycleKey]) groups[cycleKey] = [];
                groups[cycleKey].push({ ord, time: dateObj.getTime() });
            });

            Object.keys(groups).forEach(key => {
                groups[key].sort((a, b) => a.time - b.time);
                groups[key].forEach((item, idx) => {
                    item.ord.dailySeq = item.ord.no || String(idx + 1).padStart(3, '0');
                });
            });
        }

        function calculateOrderFinancials(ord) {
            let itemsSum = 0;
            if (Array.isArray(ord.items) && ord.items.length > 0) {
                ord.items.forEach(it => {
                    const price = Number(it.unitPrice || it.price || 0);
                    const qty = Number(it.qty || 1);
                    itemsSum += (price * qty);
                });
            }
            const originalSubtotal = itemsSum > 0 ? itemsSum : Number(ord.subtotal || ord.total || 0);
            const discount = ord.discount !== undefined ? Number(ord.discount) : Math.round(originalSubtotal * 0.03);
            const netTotal = ord.total !== undefined ? Number(ord.total) : Math.max(0, originalSubtotal - discount);

            return { originalSubtotal, discount, netTotal };
        }

        function generateReceiptHtml(ord) {

            if (Array.isArray(ord.items) && ord.items.length > 0) {

                    itemsRows += `
                        <tr>
                            <td style="border:1px solid #000; padding:3px 2px; text-align:right; font-weight:bold; font-size:10px;">

                            </td>
                            <td style="border:1px solid #000; padding:3px 2px; text-align:center; font-size:10px;">${qty.toFixed(2)}</td>

            const financials = calculateOrderFinancials(ord);
            const dailyNum = ord.dailySeq || ord.no || '001';

            const logoSrc = cachedLogoBase64 || `${window.location.origin}/Black-logo.png`;
            const qrSrc = cachedQrBase64 || `${window.location.origin}/qr-code.png`;

            return `

                    <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:4px; margin-bottom:4px;">
                        <img src="${logoSrc}" style="width:48px; height:48px; object-fit:contain; filter:contrast(180%); margin:0 auto 2px; display:block;" alt="لوغو">
                        <div style="font-size:15px; font-weight:900; margin:1px 0;">مطعم عالم الفواكه</div>
                        <div style="font-size:11px; font-weight:bold;">بإدارة: قسيم الحريري</div>
                        <div style="font-size:11px; font-weight:bold;">هاتف: <span style="direction:ltr; display:inline-block;">0983831671</span></div>
                        <div style="font-size:11px; margin-top:2px; font-weight:bold; background:#eee; padding:1px; border-radius:3px;">نوع الطلب: ${ord.customer?.orderType || 'خارجي'}</div>
                    </div>

                    <div style="border:2px solid #000; border-radius:6px; padding:4px 2px; margin:5px 0; text-align:center; background:#fafafa;">
                        <div style="font-size:11px; font-weight:bold; color:#222;">رقم الفاتورة</div>
                        <div style="font-size:22px; font-weight:900; letter-spacing:1px; line-height:1.1; margin-top:1px; display:flex; align-items:baseline; justify-content:center; gap:5px;">
                            <span style="font-size:12px; font-weight:bold; color:#555; text-transform:uppercase;">on</span>
                            <span>${dailyNum}</span>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:space-between; font-size:10.5px; font-weight:bold; border-bottom:1px dashed #000; padding-bottom:4px; margin-bottom:4px;">
                        <span>التاريخ:</span>
                        <span style="direction:ltr;">${ord.date || ''}</span>
                    </div>

                    ${(ord.customer?.name || ord.customer?.phone || ord.customer?.address || ord.customer?.notes) ? `
                    <div style="border-bottom:1px dashed #000; padding-bottom:5px; margin-bottom:4px; font-size:12px; line-height:1.45;">
                        ${ord.customer?.name ? `
                            <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                                <span style="font-weight:bold; min-width:55px;">الزبون:</span>
                                <strong style="font-size:13.5px; font-weight:900;">${ord.customer.name}</strong>
                            </div>` : ''}
                        ${ord.customer?.phone ? `
                            <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                                <span style="font-weight:bold; min-width:55px;">الهاتف:</span>
                                <strong style="direction:ltr; font-size:13px; font-weight:900;">${ord.customer.phone}</strong>
                            </div>` : ''}
                        ${ord.customer?.address ? `
                            <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                                <span style="font-weight:bold; min-width:55px;">العنوان:</span>
                                <strong style="font-size:12.5px; font-weight:bold; text-align:left;">${ord.customer.address}</strong>
                            </div>` : ''}
                        ${ord.customer?.notes ? `
                            <div style="background:#f4f4f4; border:1px dashed #000; border-radius:4px; padding:3px 6px; margin-top:3px; font-size:11.5px;">
                                <span style="font-weight:bold;">ملاحظات:</span> <strong>${ord.customer.notes}</strong>
                            </div>` : ''}
                    </div>` : ''}

                    <table style="width:100%; border-collapse:collapse; border:1px solid #000; margin:4px 0; table-layout:fixed;">
                        <thead>
                            <tr style="background-color:#eee;">
                                <th style="border:1px solid #000; padding:3px 1px; width:34%; text-align:center; font-size:9.5px; white-space:nowrap;">اسم المادة</th>
                                <th style="border:1px solid #000; padding:3px 1px; width:13%; text-align:center; font-size:9.5px; white-space:nowrap;">الكمية</th>
                                <th style="border:1px solid #000; padding:3px 1px; width:19%; text-align:center; font-size:9.5px; white-space:nowrap;">السعر</th>
                                <th style="border:1px solid #000; padding:3px 1px; width:19%; text-align:center; font-size:9.5px; white-space:nowrap;">إجمالي</th>
                                <th style="border:1px solid #000; padding:3px 1px; width:15%; text-align:center; font-size:9.5px; white-space:nowrap;">ملاحظات</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsRows}
                        </tbody>
                    </table>

                    <table style="width:100%; border-collapse:collapse; border:1px solid #000; margin-bottom:4px; font-size:11px; font-weight:bold;">
                        <tr>
                            <td style="border:1px solid #000; padding:2px 4px; width:50%; text-align:right;">المجموع الأصلي</td>
                            <td style="border:1px solid #000; padding:2px 4px; width:50%; text-align:center;">${financials.originalSubtotal.toLocaleString()}</td>
                        </tr>
                        <tr>
                            <td style="border:1px solid #000; padding:2px 4px; text-align:right;">الحسم (3%)</td>
                            <td style="border:1px solid #000; padding:2px 4px; text-align:center;">${financials.discount.toLocaleString()}</td>
                        </tr>
                        <tr style="background:#eee;">
                            <td style="border:1px solid #000; padding:3px 4px; text-align:right; font-size:12px;">الصافي النهائي</td>
                            <td style="border:1px solid #000; padding:3px 4px; text-align:center; font-size:13px; font-weight:900;">${financials.netTotal.toLocaleString()}</td>
                        </tr>
                    </table>

                    <div style="text-align:center; margin-top:3px; padding-top:2px;">
                        <img src="${qrSrc}" style="width:46px; height:46px; margin:0 auto; display:block;" alt="QR">
                        <div style="font-size:8.5px; font-weight:bold; margin-top:2px;">امسح الكود لتصفح المينيو والطلب 📲</div>
                    </div>

                    <div style="text-align:center; font-size:11.5px; font-weight:bold; margin-top:3px; padding-bottom:4mm;">
                        شكراً لزيارتكم مطعم عالم الفواكه!
                    </div>
                </div>
            `;
        }

        async function silentPrintBothPrinters(order) {
            const receiptHtml = generateReceiptHtml(order);

            if (isQzConnected && qz.websocket.isActive()) {
                try {
                    const printOptions = {
                        size: { width: 72 },
                        units: 'mm',
                        margins: 0,
                        rasterize: false,
                        colorType: 'monochrome'
                    };

                    const printData = [{
                        type: 'pixel',
                        format: 'html',
                        flavor: 'plain',
                        data: receiptHtml
                    }];

                    const configCashier = qz.configs.create(PRINTER_CASHIER, printOptions);
                    await qz.print(configCashier, printData);

                    const configKitchen = qz.configs.create(PRINTER_KITCHEN, printOptions);
                    await qz.print(configKitchen, printData);

                    return;
                } catch (qzErr) {
                    console.error("QZ print failed:", qzErr);
                }
            }

            const container = document.getElementById('printable-receipt');
            container.innerHTML = receiptHtml;
            window.print();
        }

        function isOrderOlderThan3Hours(order) {
            const orderDateObj = parseOrderDate(order);
            const orderTimestamp = orderDateObj.getTime();
            if (isNaN(orderTimestamp) || orderTimestamp === 0) return false;
            return (Date.now() - orderTimestamp) > (3 * 60 * 60 * 1000);
        }

        function playChimeSound() {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const playTone = (freq, start, duration, volume = 0.5) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                    gain.gain.setValueAtTime(volume, ctx.currentTime + start);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + duration);
                };
                playTone(587.33, 0, 0.4);
                playTone(880.00, 0.18, 0.7);
                playTone(587.33, 1.1, 0.4);
                playTone(880.00, 1.28, 0.7);
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound-toggle');
            if (soundEnabled) {
                btn.className = 'btn btn-sound';
                btn.innerHTML = '<i class="fa-solid fa-bell"></i> التنبيه: مفعّل';
                playChimeSound();
            } else {
                btn.className = 'btn btn-sound muted';
                btn.innerHTML = '<i class="fa-solid fa-bell-slash"></i> التنبيه: مكتوم';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initImageCache();
            connectQZ();
            loadOrders(false);

            if (autoPollingInterval) clearInterval(autoPollingInterval);
            autoPollingInterval = setInterval(() => { loadOrders(true); }, 15000);
        });

        function getOrPromptPin() {
            let pin = localStorage.getItem('cashier_pin');
            if (!pin) {
                pin = prompt('يرجى إدخال رمز دخول الكاشير (PIN):');
                if (pin) localStorage.setItem('cashier_pin', pin.trim());
            }
            return pin;
        }

        function resetPin() {
            const newPin = prompt('أدخل رمز PIN الجديد:');
            if (newPin) {
                localStorage.setItem('cashier_pin', newPin.trim());
                knownOrderIds.clear();
                isFirstLoad = true;
                loadOrders(false);
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            renderOrdersList();
        }

        async function loadOrders(isBackground = false) {
            const container = document.getElementById('orders-container');
            const pin = getOrPromptPin();

            if (!pin) {
                if (!isBackground) {
                    container.innerHTML = `
                        <div class="state-box">
                            <i class="fa-solid fa-lock fa-3x" style="margin-bottom:10px; color:#ffca28;"></i>
                            <div>يرجى إدخال رمز الدخول لعرض الطلبات.</div>
                            <button class="btn btn-auth" style="margin-top:15px;" onclick="resetPin()">إدخال الرمز</button>
                        </div>`;
                }
                return;
            }

            if (!isBackground && liveOrders.length === 0) {
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--primary-color);"></i>
                        <div style="margin-top:10px;">جاري جلب الطلبات من سوبابيس...</div>
                    </div>`;
            }

            try {
                // جلب الطلبات مباشرة من جدول online_orders في Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/online_orders?select=*&order=created_at.desc`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const fetchedOrders = await response.json();
                if (!Array.isArray(fetchedOrders)) return;

                // توحيد الحقول القادمة من قاعدة البيانات
                const normalizedOrders = fetchedOrders.map(ord => ({
                    ...ord,
                    dailySeq: ord.no || ord.dailySeq,
                    date: ord.date || (ord.created_at ? new Date(ord.created_at).toLocaleString('ar-SY') : '')
                }));

                computeDailySequences(normalizedOrders);

                if (!isFirstLoad) {
                    let latestNewOrder = null;
                    normalizedOrders.forEach(ord => {
                        if (ord.id && !knownOrderIds.has(ord.id) && !isOrderOlderThan3Hours(ord)) {
                            latestNewOrder = ord;
                        }
                    });

                    if (latestNewOrder) {
                        playChimeSound();
                        silentPrintBothPrinters(latestNewOrder);
                    }
                }

                knownOrderIds.clear();
                normalizedOrders.forEach(ord => { if (ord.id) knownOrderIds.add(ord.id); });
                isFirstLoad = false;
                liveOrders = normalizedOrders;

                updateTabCounts();
                renderOrdersList();

            } catch (error) {
                console.error('Fetch orders failed:', error);
                if (!isBackground && liveOrders.length === 0) {
                    container.innerHTML = `
                        <div class="state-box">
                            <i class="fa-solid fa-circle-exclamation fa-3x" style="color:var(--primary-color); margin-bottom:10px;"></i>
                            <div>فشل الاتصال بقاعدة البيانات. يرجى التحقق من الإنترنت.</div>
                            <button class="btn btn-refresh" style="margin-top:15px;" onclick="loadOrders(false)">إعادة المحاولة</button>
                        </div>`;
                }
            }
        }

        function updateTabCounts() {
            document.getElementById('badge-active').innerText = liveOrders.filter(o => !isOrderOlderThan3Hours(o)).length;
            document.getElementById('badge-archived').innerText = liveOrders.filter(o => isOrderOlderThan3Hours(o)).length;
            document.getElementById('badge-all').innerText = liveOrders.length;
        }

        function renderOrdersList() {
            const container = document.getElementById('orders-container');
            let filtered = liveOrders;
            if (currentTab === 'active') filtered = liveOrders.filter(o => !isOrderOlderThan3Hours(o));
            else if (currentTab === 'archived') filtered = liveOrders.filter(o => isOrderOlderThan3Hours(o));

            if (filtered.length === 0) {
                const emptyMsg = currentTab === 'active' 
                    ? 'لا توجد طلبات نشطة في آخر 3 ساعات.' 
                    : (currentTab === 'archived' ? 'لا توجد طلبات مؤرشفة (تتجاوز 3 ساعات).' : 'لا توجد أي طلبات مسجلة.');
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fa-solid fa-receipt fa-3x" style="margin-bottom:10px; opacity:0.4;"></i>
                        <div>${emptyMsg}</div>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map((ord) => {
                const isArchived = isOrderOlderThan3Hours(ord);
                const originalIndex = liveOrders.findIndex(o => o.id === ord.id);
                const financials = calculateOrderFinancials(ord);
                const dailyNum = ord.dailySeq || ord.no || '001';

                const itemsList = Array.isArray(ord.items) && ord.items.length > 0
                    ? ord.items.map(it => `
                        <div class="item-row">
                            <div>
                                <strong>${it.name || 'صنف'}</strong> (${it.size || 'عادي'}) × ${it.qty || 1}
                                ${(it.note || it.notes) ? `<br><span class="item-note-badge">👈 ${it.note || it.notes}</span>` : ''}
                            </div>
                            <div><strong>${((it.unitPrice || it.price || 0) * (it.qty || 1)).toLocaleString()} ل.س</strong></div>
                        </div>
                    `).join('')
                    : `<div style="color:var(--text-muted); font-size:0.85rem;">${ord.itemsText || 'تفاصيل الأصناف مسجلة'}</div>`;

                return `
                    <div class="order-card ${isArchived ? 'archived' : ''}">
                        <div class="order-head">
                            <div>
                                <span class="order-id"><span class="order-id-prefix">on</span> ${dailyNum}</span>
                                <div class="order-time"><i class="fa-regular fa-clock"></i> ${ord.date}</div>
                            </div>
                            <div class="badges-wrap">
                                <span class="order-badge">${ord.customer?.orderType || 'طلب'}</span>
                                <span class="status-badge ${isArchived ? 'done' : 'new'}">${isArchived ? 'مؤرشف تلقائياً' : 'نشط'}</span>
                            </div>
                        </div>

                        <div class="customer-info-box">
                            <div class="cust-row"><span class="cust-label">الزبون:</span><strong>${ord.customer?.name || '---'}</strong></div>
                            <div class="cust-row"><span class="cust-label">الهاتف:</span><span>${ord.customer?.phone || '---'}</span></div>
                            <div class="cust-row"><span class="cust-label">العنوان / النوع:</span><span>${ord.customer?.address || '---'}</span></div>
                            ${ord.customer?.notes ? `<div class="cust-row"><span class="cust-label">ملاحظات:</span><span style="color:#ffca28;">${ord.customer.notes}</span></div>` : ''}
                        </div>

                        <div class="items-list">${itemsList}</div>

                        <div class="order-total-box">
                            <div class="total-line">
                                <span>المجموع الأصلي:</span>
                                <span>${financials.originalSubtotal.toLocaleString()} ل.س</span>
                            </div>
                            <div class="total-line discount">
                                <span>الحسم (3%):</span>
                                <span>- ${financials.discount.toLocaleString()} ل.س</span>
                            </div>
                            <div class="total-line final">
                                <span>الصافي بعد الحسم:</span>
                                <span>${financials.netTotal.toLocaleString()} ل.س</span>
                            </div>
                        </div>

                        <div class="print-actions">
                            <button class="print-btn" onclick="silentPrintBothPrinters(liveOrders[${originalIndex}])">
                                <i class="fa-solid fa-print"></i> إعادة طباعة الفاتورة (الطابعتين)
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الكاشير والطباعة - عالم الفواكه</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #e50914;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --muted: #aaaaaa;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px 10px; }

        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--primary); }
        h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 5px; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 20px; }
        .refresh-btn, .clear-btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .refresh-btn { background: var(--primary); color: white; }
        .clear-btn { background: #333; color: #ff4d4d; border: 1px solid #ff4d4d; }

        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        .order-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .order-id { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
        .order-type { background: var(--primary); color: white; padding: 3px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        
        .cust-info { font-size: 0.9rem; line-height: 1.6; margin-bottom: 12px; color: #ddd; }
        .cust-info span { font-weight: bold; color: #fff; }
        
        /* حقل الملاحظات المضاف */
        .notes-box {
            background: rgba(229, 9, 20, 0.15); border: 1px dashed var(--primary);
            padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; color: #ffeb3b;
            margin-bottom: 12px; font-weight: bold;
        }

        .items-list { border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); padding: 10px 0; margin-bottom: 12px; }
        .item-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }

        .order-total { font-size: 1.1rem; font-weight: 800; text-align: left; color: var(--primary); margin-bottom: 15px; }

        .print-btn {
            width: 100%; background: #e50914; color: white; border: none; padding: 12px;
            border-radius: 8px; font-size: 1rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* تنسيقات الطابعة الحرارية (80mm) */
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt {
                position: absolute; left: 0; top: 0; width: 80mm; padding: 5mm;
                font-family: 'Courier New', Courier, monospace; color: #000; background: #fff;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <header class="no-print">
        <h1><i class="fa-solid fa-cash-register"></i> شاشة الكاشير والطلبات</h1>
        <p style="color: #888; font-size: 0.9rem;">عالم الفواكه - إدارية الوارد</p>
    </header>

    <div class="toolbar no-print">
        <button class="refresh-btn" onclick="loadOrders()"><i class="fa-solid fa-rotate"></i> تحديث الطلبات</button>
        <button class="clear-btn" onclick="clearAllOrders()"><i class="fa-solid fa-trash"></i> مسح جميع الطلبات</button>
    </div>

    <div class="orders-grid no-print" id="orders-container"></div>

    <!-- الإيصال المخصص للطباعة فقط -->
    <div id="printable-receipt" style="display: none;"></div>

    <script>
        document.addEventListener('DOMContentLoaded', loadOrders);

        function loadOrders() {
            const container = document.getElementById('orders-container');
            const orders = JSON.parse(localStorage.getItem('cashier_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">لا توجد طلبات واردة حتى الآن.</div>`;
                return;
            }

            container.innerHTML = orders.map((order, idx) => {
                const cust = order.customer || {};
                const notesHtml = cust.notes ? `<div class="notes-box">📌 <strong>ملاحظات:</strong> ${cust.notes}</div>` : '';

                const itemsHtml = order.items.map(item => `
                    <div class="item-row">
                        <span><strong>${item.qty}x</strong> ${item.name} (${item.size})</span>
                    </div>
                `).join('');

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-id">${order.id}</span>
                            <span class="order-type">${cust.orderType || 'طلب'}</span>
                        </div>
                        <div style="font-size: 0.75rem; color: #888; margin-bottom: 8px; text-align: left;">
                            <i class="fa-regular fa-clock"></i> ${order.date}
                        </div>
                        <div class="cust-info">
                            <div>الزبون: <span>${cust.name || '-'}</span></div>
                            <div>الهاتف: <span>${cust.phone || '-'}</span></div>
                            <div>العنوان: <span>${cust.address || '-'}</span></div>
                        </div>

                        ${notesHtml}

                        <div class="items-list">
                            ${itemsHtml}
                        </div>

                        <div class="order-total">
                            المجموع الكلي: ${order.total ? order.total.toLocaleString() : 0} ل.س
                        </div>

                        <button class="print-btn" onclick="printReceipt(${idx})">
                            <i class="fa-solid fa-print"></i> طباعة الفاتورة (80mm)
                        </button>
                    </div>
                `;
            }).join('');
        }

        function printReceipt(index) {
            const orders = JSON.parse(localStorage.getItem('cashier_orders') || '[]');
            const order = orders[index];
            if (!order) return;

            const cust = order.customer || {};
            const receiptEl = document.getElementById('printable-receipt');

            const itemsRows = order.items.map(item => `
                <tr>
                    <td style="padding: 3px 0;">${item.name} (${item.size})</td>
                    <td style="text-align: center;">${item.qty}</td>
                    <td style="text-align: left;">${(item.unitPrice * item.qty).toLocaleString()}</td>
                </tr>
            `).join('');

            const notesSection = cust.notes ? `
                <div style="margin-top: 5px; padding: 4px; border: 1px dashed #000; font-size: 11px;">
                    <b>ملاحظات:</b> ${cust.notes}
                </div>
            ` : '';

            receiptEl.innerHTML = `
                <div style="text-align: center; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 5px;">
                    <h2 style="font-size: 16px; margin: 0;">عالم الفواكه</h2>
                    <p style="font-size: 11px; margin: 2px 0;">فاتورة طلب - ${cust.orderType}</p>
                    <p style="font-size: 10px; margin: 0;">${order.date}</p>
                    <p style="font-size: 12px; font-weight: bold; margin-top: 3px;">رقم الطلب: ${order.id}</p>
                </div>

                <div style="font-size: 11px; margin-bottom: 5px; border-bottom: 1px dashed #000; padding-bottom: 5px;">
                    <div><b>الاسم:</b> ${cust.name}</div>
                    <div><b>الهاتف:</b> ${cust.phone}</div>
                    <div><b>العنوان:</b> ${cust.address}</div>
                    ${notesSection}
                </div>

                <table style="width: 100%; font-size: 11px; border-collapse: collapse; margin-bottom: 5px;">
                    <thead>
                        <tr style="border-bottom: 1px solid #000;">
                            <th style="text-align: right;">الصنف</th>
                            <th style="text-align: center;">العدد</th>
                            <th style="text-align: left;">السعر</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itemsRows}
                    </tbody>
                </table>

                <div style="border-top: 1px solid #000; padding-top: 5px; font-size: 12px; font-weight: bold; text-align: left;">
                    الإجمالي: ${order.total ? order.total.toLocaleString() : 0} ل.س
                </div>

                <div style="text-align: center; margin-top: 10px; font-size: 10px; border-top: 1px dashed #000; padding-top: 5px;">
                    شكراً لطلبكم من عالم الفواكه!
                </div>
            `;

            receiptEl.style.display = 'block';
            window.print();
            receiptEl.style.display = 'none';
        }

        function clearAllOrders() {
            if (confirm('هل أنت تأكد من مسح جميع الطلبات من الشاشة؟')) {
                localStorage.removeItem('cashier_orders');
                loadOrders();
            }
        }
    </script>
</body>
</html>

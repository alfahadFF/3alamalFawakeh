<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الكاشير - طلبات عالم الفواكه</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #121212; --card-bg: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding: 20px; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary-red); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: var(--primary-red); font-size: 1.6rem; }
        .clear-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 6px; cursor: pointer; }

        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 18px; position: relative; }
        .order-head { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; color: var(--primary-red); font-weight: bold; }
        .badge { background: var(--primary-red); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }

        .items-list { margin: 12px 0; border-top: 1px dashed #333; border-bottom: 1px dashed #333; padding: 10px 0; }
        .item-row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 5px; }

        .print-btn { width: 100%; background: var(--primary-red); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .print-btn:hover { background: #b80710; }

        /* --- تنسيق الفاتورة الخاص بالطابعات الحرارية (Thermal Printer 80mm / 58mm) --- */
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area {
                position: absolute; left: 0; top: 0; width: 80mm;
                padding: 5mm; color: #000; font-family: monospace; background: #fff;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>📊 شاشة الكاشير والطباعة - عالم الفواكه</h1>
        <button class="clear-btn" onclick="clearAllOrders()">مسح السجل</button>
    </div>

    <div class="orders-grid" id="orders-list"></div>

    <!-- منطقة الطباعة الفورية المتوافقة مع الطابعات الحرارية -->
    <div id="printable-area" style="display:none;"></div>

    <script>
        function loadOrders() {
            const container = document.getElementById('orders-list');
            const orders = JSON.parse(localStorage.getItem('cashier_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:50px; color:#777;">لا توجد طلبات واردة حالياً.</div>';
                return;
            }

            container.innerHTML = orders.map((order, idx) => `
                <div class="order-card">
                    <div class="order-head">
                        <span>${order.id}</span>
                        <span class="badge">${order.customer.orderType}</span>
                    </div>
                    <p style="font-size:0.9rem; color:#ccc; margin-bottom:5px;">🕒 ${order.date}</p>
                    <p><strong>الزبون:</strong> ${order.customer.name}</p>
                    <p><strong>الهاتف:</strong> ${order.customer.phone}</p>
                    <p><strong>العنوان:</strong> ${order.customer.address}</p>
                    
                    <div class="items-list">
                        ${order.items.map(i => `
                            <div class="item-row">
                                <span>${i.name} (${i.size})</span>
                                <span>×${i.qty}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div style="display:flex; justify-size:space-between; font-weight:bold; color:var(--primary-red);">
                        <span>المجموع الكلي:</span>
                        <span>${order.total.toLocaleString()} ل.س</span>
                    </div>

                    <button class="print-btn" onclick='printThermalReceipt(${idx})'>🖨️ طباعة الفاتورة (80mm)</button>
                </div>
            `).join('');
        }

        function printThermalReceipt(orderIndex) {
            const orders = JSON.parse(localStorage.getItem('cashier_orders') || '[]');
            const order = orders[orderIndex];
            if (!order) return;

            const printArea = document.getElementById('printable-area');
            
            const itemsRows = order.items.map(i => `
                <tr>
                    <td style="padding: 3px 0;">${i.name}<br><small>(${i.size})</small></td>
                    <td style="text-align:center;">${i.qty}</td>
                    <td style="text-align:left;">${(i.unitPrice * i.qty).toLocaleString()}</td>
                </tr>
            `).join('');

            printArea.innerHTML = `
                <div style="text-align:center; font-size:12px;">
                    <h2 style="font-size:16px; margin-bottom:3px;">🍎 عالم الفواكه</h2>
                    <p>فاتورة مبيعات</p>
                    <p>الطلب: ${order.id}</p>
                    <p>التاريخ: ${order.date}</p>
                </div>
                <div style="border-bottom:1px dashed #000; margin:6px 0;"></div>
                <div style="font-size:11px;">
                    <p><strong>الزبون:</strong> ${order.customer.name}</p>
                    <p><strong>الهاتف:</strong> ${order.customer.phone}</p>
                    <p><strong>النوع:</strong> ${order.customer.orderType}</p>
                    <p><strong>العنوان:</strong> ${order.customer.address}</p>
                </div>
                <div style="border-bottom:1px dashed #000; margin:6px 0;"></div>
                <table style="width:100%; font-size:11px; border-collapse:collapse; text-align:right;">
                    <thead>
                        <tr style="border-bottom:1px solid #000;">
                            <th>المادة</th>
                            <th style="text-align:center;">العدد</th>
                            <th style="text-align:left;">المجموع</th>
                        </tr>
                    </thead>
                    <tbody>${itemsRows}</tbody>
                </table>
                <div style="border-bottom:1px dashed #000; margin:6px 0;"></div>
                <div style="font-size:12px; font-weight:bold;">
                    <p>المجموع: ${order.subtotal.toLocaleString()} ل.س</p>
                    ${order.deliveryFee > 0 ? `<p>التوصيل: ${order.deliveryFee.toLocaleString()} ل.س</p>` : ''}
                    <p style="font-size:14px; margin-top:4px;">الإجمالي: ${order.total.toLocaleString()} ل.س</p>
                </div>
                <div style="border-bottom:1px dashed #000; margin:6px 0;"></div>
                <div style="text-align:center; font-size:10px; margin-top:5px;">
                    شكراً لزيارتكم عالم الفواكه!
                </div>
            `;

            printArea.style.display = 'block';
            window.print();
            printArea.style.display = 'none';
        }

        function clearAllOrders() {
            if (confirm('هل أنت تأكد من مسح جميع سجلات الطلبات المخزنة على هذا الجهاز؟')) {
                localStorage.removeItem('cashier_orders');
                loadOrders();
            }
        }

        setInterval(loadOrders, 3000);
        loadOrders();
    </script>
</body>
</html>

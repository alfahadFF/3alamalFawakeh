<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الكاشير والطلبات - عالم الفواكه</title>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #e50914;
            --primary-hover: #b80710;
            --success-color: #25d366;
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --border-color: #2e2e2e;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }

        .cashier-header {
            text-align: center; padding: 15px 0 20px;
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 15px;
        }
        .cashier-title { font-size: 1.8rem; font-weight: 900; color: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .cashier-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .toolbar {
            max-width: 900px; margin: 0 auto 15px;
            display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .toolbar-group { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            padding: 9px 15px; border-radius: 8px; border: none; font-weight: 700;
            font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s ease;
        }
        .btn:active { opacity: 0.8; }
        .btn-refresh { background-color: var(--primary-color); color: white; }
        .btn-auth { background-color: #262626; color: #ffca28; border: 1px solid #444; }
        .btn-sound { background-color: #1e3a1e; color: #4caf50; border: 1px solid #2e7d32; }
        .btn-sound.muted { background-color: #332020; color: #ff5252; border: 1px solid #5c2525; }

        /* تبويبات التصفية */
        .filter-tabs {
            max-width: 900px; margin: 0 auto 15px;
            display: flex; gap: 8px; background: #1a1a1a; padding: 6px; border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            background: transparent; color: var(--text-muted); font-weight: 800;
            font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab-btn.active {
            background: var(--primary-color); color: white;
            box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
        }
        .tab-badge {
            background: rgba(0,0,0,0.3); padding: 2px 7px; border-radius: 10px; font-size: 0.75rem;
        }

        .orders-grid {
            max-width: 900px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 16px;
        }

        .order-card {
            background-color: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color);
            padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; gap: 12px;
            animation: fadeIn 0.4s ease;
        }
        .order-card.archived {
            opacity: 0.7;
            background-color: #141414;
            border-color: #2a2a2a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-head {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed var(--border-color); padding-bottom: 10px;
        }
        .order-id { font-size: 1.2rem; font-weight: 900; color: var(--primary-color); }
        
        .badges-wrap { display: flex; gap: 6px; align-items: center; }
        .order-badge {
            background-color: #333; color: #fff;
            padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: bold;
        }
        .status-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 800;
        }
        .status-badge.new { background-color: #e50914; color: #fff; }
        .status-badge.done { background-color: #444; color: #aaa; }

        .order-time { font-size: 0.8rem; color: var(--text-muted); }

        .customer-info-box {
            background-color: #121212; padding: 10px 14px; border-radius: 8px;
            font-size: 0.88rem; line-height: 1.6; border: 1px solid #282828;
        }
        .cust-row { display: flex; gap: 8px; }
        .cust-label { color: var(--text-muted); font-weight: 700; min-width: 85px; }

        .items-list { display: flex; flex-direction: column; gap: 8px; margin: 4px 0; }
        .item-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            background: #202020; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
        }
        .item-note-badge {
            display: inline-block; background: rgba(255, 183, 77, 0.15); color: #ffb74d;
            font-size: 0.78rem; padding: 2px 6px; border-radius: 4px; margin-top: 3px; font-weight: 600;
        }

        .order-total-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2rem; font-weight: 900; color: var(--primary-color);
            padding-top: 8px; border-top: 1px solid var(--border-color);
        }

        .print-btn {
            background-color: var(--primary-color); color: #fff; border: none;
            padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .print-btn:hover { background-color: var(--primary-hover); }

        .state-box { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 1.1rem; }

        /* ================================================= */
        /* نافذة الإشعار المنبثق لشاشات اللمس POS             */
        /* ================================================= */
        .pos-alert-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }

        .pos-alert-box {
            background: #1c1c1c; border: 3px solid var(--primary-color);
            border-radius: 24px; padding: 25px 20px; max-width: 440px; width: 100%;
            text-align: center; box-shadow: 0 0 40px rgba(229, 9, 20, 0.7);
            animation: pulseAlert 1.2s infinite alternate ease-in-out;
        }

        @keyframes pulseAlert {
            0% { transform: scale(0.98); box-shadow: 0 0 25px rgba(229, 9, 20, 0.5); }
            100% { transform: scale(1.02); box-shadow: 0 0 50px rgba(229, 9, 20, 0.9); }
        }

        .pos-alert-icon {
            width: 70px; height: 70px; border-radius: 50%;
            background: var(--primary-color); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; margin: 0 auto 15px;
            animation: ringBell 0.8s infinite ease-in-out;
        }

        @keyframes ringBell {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(15deg); }
            40% { transform: rotate(-15deg); }
            60% { transform: rotate(10deg); }
            80% { transform: rotate(-10deg); }
        }

        .pos-alert-title { font-size: 1.6rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
        .pos-alert-info {
            background: #111; border: 1px dashed #444; border-radius: 12px;
            padding: 12px; margin: 15px 0 20px; font-size: 1rem; line-height: 1.6;
        }
        .pos-alert-btn {
            width: 100%; background: #25d366; color: #000;
            border: none; padding: 14px; border-radius: 12px;
            font-size: 1.15rem; font-weight: 900; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
        .pos-alert-btn:active { transform: scale(0.97); }

        /* الطباعة الحرارية 80mm */
        #printable-receipt { display: none; }

        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt {
                display: block !important;
                position: absolute; left: 0; top: 0;
                width: 78mm; max-width: 80mm;
                margin: 0; padding: 6px;
                color: #000 !important; background: #fff !important;
                font-size: 12px; line-height: 1.35;
            }
            .p-header { text-align: center; border-bottom: 2px dashed #000; padding-bottom: 8px; margin-bottom: 8px; }
            .p-logo { width: 75px; height: 75px; object-fit: contain; margin-bottom: 4px; filter: contrast(150%); }
            .p-title { font-size: 17px; font-weight: 900; margin: 2px 0; }
            .p-meta { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
            .p-phone { font-size: 12px; font-weight: bold; direction: ltr; display: inline-block; }
            .p-order-box { border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 6px; }
            .p-order-id { font-size: 16px; font-weight: 900; text-align: center; margin: 4px 0; }
            .p-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 2px; }
            .p-cust-box { border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 6px; font-size: 11px; }
            .p-table { width: 100%; border-collapse: collapse; margin: 6px 0; }
            .p-table th { border-bottom: 1px solid #000; font-size: 11px; padding: 4px 0; text-align: right; }
            .p-table td { padding: 4px 0; vertical-align: top; border-bottom: 1px dotted #ccc; font-size: 11px; }
            .p-item-note { font-size: 10px; font-weight: bold; display: block; margin-top: 2px; padding-right: 5px; }
            .p-total-box { border-top: 2px dashed #000; border-bottom: 2px dashed #000; padding: 6px 0; margin: 6px 0; }
            .p-total-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 900; }
            .p-qr-box { text-align: center; margin-top: 8px; padding-top: 4px; }
            .p-qr-img { width: 85px; height: 85px; object-fit: contain; margin: 0 auto; display: block; }
            .p-qr-text { font-size: 10px; font-weight: bold; margin-top: 4px; }
            .p-footer { text-align: center; font-size: 11px; font-weight: bold; margin-top: 8px; padding-top: 4px; }
        }
    </style>
</head>
<body>

    <header class="cashier-header">
        <h1 class="cashier-title"><i class="fa-solid fa-cash-register"></i> شاشة الكاشير والطلبات</h1>
        <p class="cashier-subtitle">مطعم عالم الفواكه - أرشفة تلقائية للطلبات المتجاوزة 3 ساعات</p>
    </header>

    <div class="toolbar">
        <div class="toolbar-group">
            <button class="btn btn-refresh" onclick="loadOrders(false)"><i class="fa-solid fa-rotate"></i> تحديث الطلبات</button>
            <button class="btn btn-sound" id="btn-sound-toggle" onclick="toggleSound()"><i class="fa-solid fa-bell"></i> التنبيه: مفعّل</button>
        </div>
        <div class="toolbar-group">
            <button class="btn btn-auth" onclick="resetPin()"><i class="fa-solid fa-key"></i> تغيير رمز PIN</button>
        </div>
    </div>

    <!-- أزرار التصفية -->
    <div class="filter-tabs">
        <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">
            <i class="fa-solid fa-bell-concierge"></i> النشطة (آخر 3 ساعات)
            <span class="tab-badge" id="badge-active">0</span>
        </button>
        <button class="tab-btn" id="tab-archived" onclick="switchTab('archived')">
            <i class="fa-solid fa-box-archive"></i> الأرشيف (أقدم من 3 ساعات)
            <span class="tab-badge" id="badge-archived">0</span>
        </button>
        <button class="tab-btn" id="tab-all" onclick="switchTab('all')">
            <i class="fa-solid fa-list"></i> الكل
            <span class="tab-badge" id="badge-all">0</span>
        </button>
    </div>

    <main class="orders-grid" id="orders-container"></main>

    <!-- نافذة الإشعار المنبثق البصري لشاشات اللمس -->
    <div class="pos-alert-overlay" id="pos-alert-modal">
        <div class="pos-alert-box">
            <div class="pos-alert-icon">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h2 class="pos-alert-title">وصول طلب جديد!</h2>
            <div class="pos-alert-info" id="pos-alert-content"></div>
            <button class="pos-alert-btn" onclick="dismissAlert()">
                <i class="fa-solid fa-check"></i> استلام وعرض الفاتورة
            </button>
        </div>
    </div>

    <!-- الهيكل الخاص بالطباعة الحرارية 80mm -->
    <div id="printable-receipt"></div>

    <script>
        let liveOrders = [];
        let knownOrderIds = new Set();
        let isFirstLoad = true;
        let soundEnabled = true;
        let autoPollingInterval = null;
        let currentTab = 'active';

        // دالة فحص وتحويل التاريخ العربي لحساب الـ 3 ساعات
        function isOrderOlderThan3Hours(order) {
            if (!order || !order.date) return false;

            try {
                let dateStr = String(order.date).trim();

                const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
                arabicDigits.forEach((digit, i) => {
                    dateStr = dateStr.replace(new RegExp(digit, 'g'), i);
                });

                const isPM = dateStr.includes('م') || /pm/i.test(dateStr);
                const isAM = dateStr.includes('ص') || /am/i.test(dateStr);
                dateStr = dateStr.replace(/[صمAPMapm]/g, '').trim();

                const parts = dateStr.split(/[\s,]+/);
                if (parts.length < 2) return false;

                const dateParts = parts[0].split(/[\/\-\.]/).map(p => parseInt(p, 10));
                const timeParts = parts[1].split(':').map(p => parseInt(p, 10));

                if (dateParts.length < 3 || timeParts.length < 1) return false;

                let day, month, year;
                if (dateParts[0] > 1000) {
                    year = dateParts[0]; month = dateParts[1] - 1; day = dateParts[2];
                } else {
                    day = dateParts[0]; month = dateParts[1] - 1; year = dateParts[2];
                }

                let hours = timeParts[0];
                const minutes = timeParts[1] || 0;
                const seconds = timeParts[2] || 0;

                if (isPM && hours < 12) hours += 12;
                if (isAM && hours === 12) hours = 0;

                const orderDateObj = new Date(year, month, day, hours, minutes, seconds);
                const orderTimestamp = orderDateObj.getTime();

                if (isNaN(orderTimestamp)) return false;

                const now = Date.now();
                const threeHoursInMs = 3 * 60 * 60 * 1000;

                return (now - orderTimestamp) > threeHoursInMs;

            } catch (err) {
                console.error("Error parsing date:", err);
                return false;
            }
        }

        // جرس التنبيه الصوتي
        function playChimeSound() {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                const playTone = (freq, start, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime + start);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + duration);
                };

                playTone(587.33, 0, 0.4);
                playTone(880.00, 0.18, 0.7);
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        // إظهار الإشعار المنبثق البصري على الشاشة
        function showVisualAlert(order) {
            const modal = document.getElementById('pos-alert-modal');
            const content = document.getElementById('pos-alert-content');
            
            const totalVal = Number(order.total || order.subtotal || 0).toLocaleString();
            
            content.innerHTML = `
                <div style="font-size:1.15rem; font-weight:900; color:var(--primary-color); margin-bottom:5px;">
                    رقم الطلب: ${order.id}
                </div>
                <div>👤 <strong>الزبون:</strong> ${order.customer?.name || 'زبون'}</div>
                <div>🛵 <strong>النوع:</strong> ${order.customer?.orderType || 'طلب'}</div>
                <div style="margin-top:6px; font-weight:800; color:#25d366; font-size:1.1rem;">
                    💰 الإجمالي: ${totalVal} ل.س
                </div>
            `;
            
            modal.style.display = 'flex';
        }

        function dismissAlert() {
            document.getElementById('pos-alert-modal').style.display = 'none';
            switchTab('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound-toggle');
            if (soundEnabled) {
                btn.className = 'btn btn-sound';
                btn.innerHTML = '<i class="fa-solid fa-bell"></i> التنبيه: مفعّل';
                playChimeSound();
            } else {
                btn.className = 'btn btn-sound muted';
                btn.innerHTML = '<i class="fa-solid fa-bell-slash"></i> التنبيه: مكتوم';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders(false);

            if (autoPollingInterval) clearInterval(autoPollingInterval);
            autoPollingInterval = setInterval(() => {
                loadOrders(true);
            }, 15000);
        });

        function getOrPromptPin() {
            let pin = localStorage.getItem('cashier_pin');
            if (!pin) {
                pin = prompt('يرجى إدخال رمز دخول الكاشير (PIN):');
                if (pin) {
                    localStorage.setItem('cashier_pin', pin.trim());
                }
            }
            return pin;
        }

        function resetPin() {
            const newPin = prompt('أدخل رمز PIN الجديد:');
            if (newPin) {
                localStorage.setItem('cashier_pin', newPin.trim());
                knownOrderIds.clear();
                isFirstLoad = true;
                loadOrders(false);
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            renderOrdersList();
        }

        async function loadOrders(isBackground = false) {
            const container = document.getElementById('orders-container');
            const pin = getOrPromptPin();

            if (!pin) {
                if (!isBackground) {
                    container.innerHTML = `
                        <div class="state-box">
                            <i class="fa-solid fa-lock fa-3x" style="margin-bottom:10px; color:#ffca28;"></i>
                            <div>يرجى إدخال رمز الدخول لعرض الطلبات.</div>
                            <button class="btn btn-auth" style="margin-top:15px;" onclick="resetPin()">إدخال الرمز</button>
                        </div>`;
                }
                return;
            }

            if (!isBackground && liveOrders.length === 0) {
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--primary-color);"></i>
                        <div style="margin-top:10px;">جاري جلب الطلبات من السيرفر...</div>
                    </div>`;
            }

            try {
                const response = await fetch('/.netlify/functions/orders', {
                    method: 'GET',
                    headers: { 'x-cashier-pin': pin }
                });

                if (response.status === 401) {
                    localStorage.removeItem('cashier_pin');
                    if (!isBackground) {
                        container.innerHTML = `
                            <div class="state-box">
                                <i class="fa-solid fa-triangle-exclamation fa-3x" style="color:var(--primary-color); margin-bottom:10px;"></i>
                                <div>رمز PIN غير صحيح. تعذر فتح السجل.</div>
                                <button class="btn btn-auth" style="margin-top:15px;" onclick="resetPin()">إعادة المحاولة</button>
                            </div>`;
                    }
                    return;
                }

                if (!response.ok) throw new Error('Network error');

                const fetchedOrders = await response.json();
                if (!Array.isArray(fetchedOrders)) return;

                // التحقق من وصول طلب جديد لإطلاق الصوت + الإشعار المنبثق
                if (!isFirstLoad) {
                    let latestNewOrder = null;
                    fetchedOrders.forEach(ord => {
                        if (ord.id && !knownOrderIds.has(ord.id) && !isOrderOlderThan3Hours(ord)) {
                            latestNewOrder = ord;
                        }
                    });

                    if (latestNewOrder) {
                        playChimeSound();              // 1. الصوت
                        showVisualAlert(latestNewOrder); // 2. الإشعار المنبثق البصري
                    }
                }

                knownOrderIds.clear();
                fetchedOrders.forEach(ord => { if (ord.id) knownOrderIds.add(ord.id); });
                isFirstLoad = false;
                liveOrders = fetchedOrders;

                updateTabCounts();
                renderOrdersList();

            } catch (error) {
                console.error('Fetch orders failed:', error);
                if (!isBackground && liveOrders.length === 0) {
                    container.innerHTML = `
                        <div class="state-box">
                            <i class="fa-solid fa-circle-exclamation fa-3x" style="color:var(--primary-color); margin-bottom:10px;"></i>
                            <div>فشل الاتصال بقاعدة البيانات. يرجى التحقق من الإنترنت.</div>
                            <button class="btn btn-refresh" style="margin-top:15px;" onclick="loadOrders(false)">إعادة المحاولة</button>
                        </div>`;
                }
            }
        }

        function updateTabCounts() {
            const activeCount = liveOrders.filter(o => !isOrderOlderThan3Hours(o)).length;
            const archivedCount = liveOrders.filter(o => isOrderOlderThan3Hours(o)).length;
            
            document.getElementById('badge-active').innerText = activeCount;
            document.getElementById('badge-archived').innerText = archivedCount;
            document.getElementById('badge-all').innerText = liveOrders.length;
        }

        function renderOrdersList() {
            const container = document.getElementById('orders-container');

            let filtered = liveOrders;
            if (currentTab === 'active') {
                filtered = liveOrders.filter(o => !isOrderOlderThan3Hours(o));
            } else if (currentTab === 'archived') {
                filtered = liveOrders.filter(o => isOrderOlderThan3Hours(o));
            }

            if (filtered.length === 0) {
                const emptyMsg = currentTab === 'active' 
                    ? 'لا توجد طلبات نشطة في آخر 3 ساعات.' 
                    : (currentTab === 'archived' ? 'لا توجد طلبات مؤرشفة (تتجاوز 3 ساعات).' : 'لا توجد أي طلبات مسجلة.');
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fa-solid fa-receipt fa-3x" style="margin-bottom:10px; opacity:0.4;"></i>
                        <div>${emptyMsg}</div>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map((ord) => {
                const isArchived = isOrderOlderThan3Hours(ord);
                const originalIndex = liveOrders.findIndex(o => o.id === ord.id);

                const itemsList = Array.isArray(ord.items) && ord.items.length > 0
                    ? ord.items.map(it => `
                        <div class="item-row">
                            <div>
                                <strong>${it.name || 'صنف'}</strong> (${it.size || 'عادي'}) × ${it.qty || 1}
                                ${it.note ? `<br><span class="item-note-badge">👈 ${it.note}</span>` : ''}
                            </div>
                            <div><strong>${((it.unitPrice || 0) * (it.qty || 1)).toLocaleString()} ل.س</strong></div>
                        </div>
                    `).join('')
                    : `<div style="color:var(--text-muted); font-size:0.85rem;">${ord.itemsText || 'تفاصيل الأصناف مسجلة'}</div>`;

                const totalVal = ord.total || ord.subtotal || 0;

                return `
                    <div class="order-card ${isArchived ? 'archived' : ''}">
                        <div class="order-head">
                            <div>
                                <span class="order-id">${ord.id}</span>
                                <div class="order-time"><i class="fa-regular fa-clock"></i> ${ord.date}</div>
                            </div>
                            <div class="badges-wrap">
                                <span class="order-badge">${ord.customer?.orderType || 'طلب'}</span>
                                <span class="status-badge ${isArchived ? 'done' : 'new'}">${isArchived ? 'مؤرشف تلقائياً' : 'نشط'}</span>
                            </div>
                        </div>

                        <div class="customer-info-box">
                            <div class="cust-row"><span class="cust-label">الزبون:</span><strong>${ord.customer?.name || '---'}</strong></div>
                            <div class="cust-row"><span class="cust-label">الهاتف:</span><span>${ord.customer?.phone || '---'}</span></div>
                            <div class="cust-row"><span class="cust-label">العنوان / النوع:</span><span>${ord.customer?.address || '---'}</span></div>
                            ${ord.customer?.notes ? `<div class="cust-row"><span class="cust-label">ملاحظات:</span><span style="color:#ffca28;">${ord.customer.notes}</span></div>` : ''}
                        </div>

                        <div class="items-list">${itemsList}</div>

                        <div class="order-total-row">
                            <span>المجموع الكلي:</span>
                            <span>${Number(totalVal).toLocaleString()} ل.س</span>
                        </div>

                        <button class="print-btn" onclick="printReceipt(${originalIndex})">
                            <i class="fa-solid fa-print"></i> طباعة الفاتورة (80mm)
                        </button>
                    </div>
                `;
            }).join('');
        }

        function printReceipt(orderIndex) {
            const ord = liveOrders[orderIndex];
            if (!ord) return;

            let itemsTableRows = '';
            if (Array.isArray(ord.items) && ord.items.length > 0) {
                ord.items.forEach(it => {
                    const total = (it.unitPrice || 0) * (it.qty || 1);
                    itemsTableRows += `
                        <tr>
                            <td>
                                <strong>${it.name}</strong> (${it.size})
                                ${it.note ? `<span class="p-item-note">👈 ملاحظة: ${it.note}</span>` : ''}
                            </td>
                            <td style="text-align:center;">${it.qty}</td>
                            <td style="text-align:left;">${total.toLocaleString()}</td>
                        </tr>
                    `;
                });
            } else {
                itemsTableRows = `
                    <tr>
                        <td colspan="3">${ord.itemsText || 'تفاصيل الطلب'}</td>
                    </tr>
                `;
            }

            const totalVal = Number(ord.total || ord.subtotal || 0);

            const receiptContainer = document.getElementById('printable-receipt');
            receiptContainer.innerHTML = `
                <div class="p-header">
                    <img src="/Black-logo.png" class="p-logo" alt="لوغو المطعم" onerror="this.src='/Black-logo.svg'; this.onerror=function(){this.src='/logo.png';};">
                    <div class="p-title">مطعم عالم الفواكه</div>
                    <div class="p-meta">بإدارة: قسيم الحريري</div>
                    <div class="p-meta">هاتف: <span class="p-phone">0938174782</span></div>
                    <div style="font-size:11px; margin-top:2px;">فاتورة طلب - ${ord.customer?.orderType || ''}</div>
                </div>

                <div class="p-order-box">
                    <div class="p-order-id">رقم الطلب: ${ord.id}</div>
                    <div class="p-row"><span>التاريخ:</span><span>${ord.date}</span></div>
                </div>

                <div class="p-cust-box">
                    <div class="p-row"><span>الاسم:</span><strong>${ord.customer?.name || ''}</strong></div>
                    <div class="p-row"><span>الهاتف:</span><span>${ord.customer?.phone || ''}</span></div>
                    <div class="p-row"><span>العنوان / النوع:</span><span>${ord.customer?.address || ''}</span></div>
                    ${ord.customer?.notes ? `<div class="p-row" style="margin-top:2px;"><span>ملاحظة:</span><span>${ord.customer.notes}</span></div>` : ''}
                </div>

                <table class="p-table">
                    <thead>
                        <tr>
                            <th style="width:55%;">الصنف</th>
                            <th style="width:15%; text-align:center;">العدد</th>
                            <th style="width:30%; text-align:left;">السعر</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itemsTableRows}
                    </tbody>
                </table>

                <div class="p-total-box">
                    <div class="p-total-row">
                        <span>الإجمالي:</span>
                        <span>${totalVal.toLocaleString()} ل.س</span>
                    </div>
                </div>

                <div class="p-qr-box">
                    <img src="/qr-code.png" class="p-qr-img" alt="QR Code" onerror="this.style.display='none'">
                    <div class="p-qr-text">امسح الكود لتصفح المينيو والطلب من جديد 📲</div>
                </div>

                <div class="p-footer">
                    شكراً لزيارتكم مطعم عالم الفواكه!
                </div>
            `;

            window.print();
        }
    </script>
</body>
</html>
